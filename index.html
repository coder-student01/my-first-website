<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaditya Anand Dubey | Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1d2671, #c33764);
      color: #ffffff;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 35px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }
    .tag {
      display: inline-block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 1rem;
      opacity: 0.9;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #ff5722;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 87, 34, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="tag">Welcome</span>
    <h1>Aaditya Anand Dubey</h1>
    <p class="subtitle">Class 8th Student &amp; Aspiring Developer.<br>This website is coded and hosted directly from my mobile device!</p>
    <button onclick="greetUser()">Say Hello!</button>
  </div>

  <script>
    function greetUser() {
      alert("Hello from Aaditya Anand Dubey's website!");
    }
  </script>

</body>
</html>
